---
layout: default
load_leaflet: 1
---
<article class="waterfall-page">
  <h1 id="poi_title">{{ page.title | escape }}</h1>
  <span id="wikidata_title" hidden></span>
  <p id="wikidata_descr">{{ page.description | escape }}</p>
  <p>
    <a id="wikidata_href" hidden target="_blank"
       rel="noopener noreferrer">Ελληνικό λήμμα Wikipedia</a>
  </p>
  <span id="wikipedia_title" hidden></span>
  <p id="wikidata_location"></p>
  {% if page.image %}
  <img id="wikidata_img" src="{{ page.image | relative_url }}"
       alt="{{ page.title | escape }}"
       style="width:100%;height:auto;padding-bottom:8px;">
  {% else %}
  <img id="wikidata_img" hidden alt="{{ page.title | escape }}"
       style="width:100%;height:auto;padding-bottom:8px;">
  {% endif %}
  <div id="map"
       style="height:320px;width:100%;background:#eef2ef"></div>
  {{ content }}
</article>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script>
  var wikidatum = {{ page.wikidatum | jsonify }};
</script>
<script src="{{ '/assets/js/get_wiki_item.js' | relative_url }}"></script>
