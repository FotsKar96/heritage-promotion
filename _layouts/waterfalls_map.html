---
layout: default
load_leaflet: 1
---
<link rel="stylesheet" href="{{ '/assets/css/waterfall-sections.css' | relative_url }}">
<h1>{{ page.title | escape }}</h1>
{{ content }}
<p id="waterfall-map-status">Φόρτωση σημείων...</p>
<div id="waterfall-map" style="height:480px;width:100%"></div>
<script>
window.waterfallPoints = [
{% assign points = site.pois | sort: 'order' %}
{% for p in points %}
  {
    qid: {{ p.wikidatum | jsonify }},
    title: {{ p.title | jsonify }},
    url: {{ p.url | relative_url | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
];
</script>
<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script src="{{ '/assets/js/waterfall-map.js' | relative_url }}"></script>

<div class="waterfall-qr-row waterfall-qr-row-center">
  <figure class="waterfall-qr">
    <a href="{{ '/assets/images/qr/map-qr.svg' | relative_url }}"
       target="_blank" rel="noopener noreferrer">
      <img src="{{ '/assets/images/qr/map-qr.svg' | relative_url }}"
           alt="QR για τον συνολικό χάρτη των καταρρακτών"
           width="180" height="180" loading="lazy">
    </a>
    <figcaption>
      <strong>Ο χάρτης στο κινητό σας</strong><br>
      Σαρώστε το QR ή πατήστε το για μεγέθυνση.
    </figcaption>
  </figure>
</div>
{% include waterfall-share.html %}
