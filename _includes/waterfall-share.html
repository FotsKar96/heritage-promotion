<section class="waterfall-share" data-waterfall-share aria-label="Κοινοποίηση της σελίδας" data-share-title="{{ page.title | escape }} — {{ site.title | escape }}">
  <h2>Μοιραστείτε την ανακάλυψη</h2>
  <p>Στείλτε αυτή τη σελίδα στην παρέα σας και οργανώστε την επόμενη εξόρμηση.</p>
  <div class="waterfall-share-actions">
    <button type="button" data-copy-link hidden>Αντιγραφή συνδέσμου</button>
    <button type="button" data-native-share hidden>Κοινοποίηση</button>
    <a data-email-share href="mailto:?subject={{ page.title | url_encode }}&amp;body={{ page.url | absolute_url | url_encode }}">Κοινοποίηση με email</a>
  </div>
  <label class="waterfall-copy-fallback" data-copy-fallback hidden>Σύνδεσμος της σελίδας<input type="text" readonly aria-label="Σύνδεσμος για αντιγραφή" data-copy-field></label>
  <p class="waterfall-share-status" data-share-status role="status" aria-live="polite" aria-atomic="true"></p>
</section>
<script src="{{ '/assets/js/waterfall-share.js' | relative_url }}" defer></script>
