{% if include.id %}
<section class="waterfall-video-section" style="max-width:800px;margin:2rem auto;">
  <h2>Βίντεο από την περιοχή</h2>

  <div style="position:relative;aspect-ratio:16 / 9;min-height:200px;">
    <iframe
      src="https://www.youtube-nocookie.com/embed/{{ include.id | escape }}?playsinline=1"
      title="{{ page.title | escape }} — βίντεο"
      width="800"
      height="450"
      loading="lazy"
      style="position:absolute;inset:0;width:100%;height:100%;border:0;"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
      allowfullscreen>
    </iframe>
  </div>

  <p>
    Βίντεο: {{ include.author | escape }} ·
    <a href="https://www.youtube.com/watch?v={{ include.id | escape }}"
       target="_blank" rel="noopener">Προβολή στο YouTube ↗</a>
  </p>
</section>
{% endif %}
