    - label: "Visit Peloponnese — Νέδα"
      url: "https://visitpeloponnese.com/el/prdct/neda-apokosmi-empeiria-apo-faraggi-stoys-katarraktes"

Q123279134:
  name: "Καταρράκτης Φονιά"
  height: null
  height_note: "Δεν αποδίδεται εδώ ύψος άλλης πτώσης του ίδιου ρέματος στο συγκεκριμένο σημείο."
  landscape: "Ρέμα με καταρράκτες και βάθρες"
  interest: "Οι βάθρες είναι φυσικές λιμνούλες που διαμορφώνονται ανάμεσα στα βράχια."
