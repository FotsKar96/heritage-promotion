    - label: "Δήμος Ιεράπετρας — Φαράγγι Μυλωνά"
      url: "https://www.ierapetra.gr/index.php/en/nature/143-mylonas-canyon"

Q134572270:
  name: "Καταρράκτης Βαλανάρη"
  height: "6 μ."
  height_note: "Το ύψος που αναφέρει ο Δήμος Ραφήνας–Πικερμίου."
  landscape: "Καταρράκτης στο ρέμα Βαλανάρη, στο Ντράφι"
  interest: "Με λιγότερη ροή εμφανίζονται δύο δίδυμες πτώσεις. Η μορφή του αλλάζει ανάλογα με τις βροχές."
  sources:
    - label: "Δήμος Ραφήνας–Πικερμίου — Βαλανάρης"
      url: "https://rafina-pikermi.gr/istorika-laografika-mnimeia-pikermioy/"

Q134580916:
  name: "Καταρράκτες Πυθάρας"
  height: null
  height_note: "Ο Δήμος Άνδρου περιγράφει μικρούς καταρράκτες χωρίς αριθμητικό ύψος πτώσης."
  landscape: "Καταπράσινη ρεματιά με μικρούς καταρράκτες και λιμνούλες"
  interest: "Τα νερά της χρησιμοποιούνταν παλιότερα για τη λειτουργία της Φάμπρικας, του νερόμυλου στις Στενιές."
