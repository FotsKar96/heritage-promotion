Q123280515:
  name: "Καταρράκτης Μυλωνά"
  height: "20 μ."
  height_note: "Η τιμή που δημοσιεύει ο Δήμος Ιεράπετρας για τον καταρράκτη στο φαράγγι Μυλωνά."
  landscape: "Καταρράκτης σε φαράγγι της ανατολικής Κρήτης"
  interest: "Το φαράγγι συνδέει την περιοχή του Αγίου Ιωάννη με την παραλία Κακιά Σκάλα."
