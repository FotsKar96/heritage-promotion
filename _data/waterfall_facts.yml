Q50809609:
  name: "Καταρράκτες Έδεσσας"
  height: "70 μ."
  height_note: "Αφορά τον Κάρανο, όχι το άθροισμα των καταρρακτών της Έδεσσας."
  landscape: "Καταρράκτες μέσα στο αστικό τοπίο"
  interest: "Η διαδρομή θέασης του Κάρανου περιλαμβάνει σημείο πίσω από την υδάτινη κουρτίνα."
  sources:
    - label: "Edessa Guide — Κάρανος"
      url: "https://visitedessa.gr/en/sights/52/1-areas-of-special-environmental-significance/64/karanos-waterfall"

Q96143730:
  name: "Καταρράκτες της Δρυμώνας"
  height: "10 μ."
  height_note: "Η μεγαλύτερη πτώση όπως αναφέρεται στη σελίδα του ΕΟΤ."
  landscape: "Μικρό φαράγγι με καταρράκτες και λιμνούλες"
  interest: "Ο ποταμός Σηπιάς δημιουργεί τρεις καταρράκτες. Η ροή είναι περιορισμένη στην καρδιά του καλοκαιριού."
  sources:
    - label: "Visit Greece / ΕΟΤ — Δρυμώνας"
      url: "https://www.visitgreece.gr/el/experiences/nature/gorges/drymonas-waterfalls"

Q16329450:
  name: "Πολυλίμνιο Μεσσηνίας"
  height: "Περίπου 25 μ."
  height_note: "Αφορά την Καδούλα μέσα στο σύμπλεγμα, όχι ενιαίο ύψος όλου του Πολυλιμνίου."
  landscape: "Σύμπλεγμα φυσικών λιμνών και καταρρακτών"
  interest: "Κοντά στη Χαραυγή, οι λίμνες συνδέονται μεταξύ τους με ρέμα και μικρές πτώσεις νερού."
  sources:
    - label: "Visit Greece / ΕΟΤ — Πολυλίμνιο"
      url: "https://www.visitgreece.gr/el/experiences/nature/gorges/polylimnio-messenia"

Q105529431:
  name: "Καταρράκτης Μαν Κάτσα"
  height: "Περίπου 15 μ."
  height_note: "Το ύψος του γκρεμού από τον οποίο πέφτει το νερό, σύμφωνα με το Visit Lesvos."
  landscape: "Ρέμα και μικρή φυσική λίμνη σε ηφαιστειακά πετρώματα"
  interest: "Ο Ασπροπόταμος συναντά πετρώματα ιγνιμβρίτη που συνδέονται με την ηφαιστειακή ιστορία της Λέσβου."
  sources:
    - label: "Visit Lesvos — Μαν Κάτσα"
      url: "https://www.visitlesvos.gr/pois/man-katsa-waterfall/"

Q109562646:
  name: "Καταρράκτης Λειβαδίτη"
  height: "Περίπου 60 μ."
  height_note: "Η κατακόρυφη πτώση όπως περιγράφεται από τον Δήμο Ξάνθης."
  landscape: "Δασικό τοπίο με κατακόρυφη πτώση νερού"
  interest: "Είναι γνωστός και ως καταρράκτης Τραχωνίου. Τον χειμώνα μπορεί να παγώσει."
  sources:
    - label: "Δήμος Ξάνθης — Λειβαδίτης / Τραχώνι"
      url: "https://www.cityofxanthi.gr/episkeptes/axiotheata/stavroupoli/katarraktis-tou-leivaditi-i-traxoniou"

Q123279956:
  name: "Καταρράκτης Νέδας"
  height: null
  height_note: "Δεν έχει διασταυρωθεί αριθμητική τιμή για τον συγκεκριμένο καταρράκτη της καταχώρισης."
  landscape: "Καταρράκτης στο ποτάμιο τοπίο της Νέδας"
  interest: "Η καταχώριση αφορά ένα σημείο του ποταμού και όχι ολόκληρη τη διαδρομή του φαραγγιού."
